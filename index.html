<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drift Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#000;--surface:#0a0a0a;--surface2:#111;--border:#2a2a38;--border-bright:#3a3a50;
  --text-primary:#f2f2f8;--text-secondary:#9a9ab5;--text-dim:#6a6a85;
  --green:#00d97e;--green-dim:#00d97e18;--green-mid:#00d97e44;
  --red:#ff4757;--red-dim:#ff475718;--red-mid:#ff475744;
  --amber:#ffb347;--amber-dim:#ffb34718;--amber-mid:#ffb34744;
  --blue:#4a9eff;
  --mono:'Inter',sans-serif;
}
body{background:var(--bg);font-family:var(--mono);color:var(--text-primary);font-size:13px;min-height:100vh;
  background-image:radial-gradient(ellipse at 20% 0%,#1a1a2e 0%,transparent 55%),radial-gradient(ellipse at 80% 100%,#0d1a2e 0%,transparent 55%);}
.topnav{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 20px;display:flex;align-items:center;height:46px;}
.brand{font-size:15px;font-weight:700;letter-spacing:-.02em;}
.brand span{color:var(--green);}
.meta{margin-left:auto;font-size:10px;color:var(--text-dim);}
.page{padding:16px;display:flex;flex-direction:column;gap:14px;max-width:1400px;margin:0 auto;}
.section{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.section-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;
  border-bottom:1px solid var(--border);background:var(--surface2);}
.section-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);}
.summary{font-size:10px;color:var(--text-dim);}
.sortbar{display:flex;gap:6px;padding:10px 14px 0;}
.sortbtn{font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;
  border-radius:3px;cursor:pointer;color:var(--text-secondary);background:transparent;border:1px solid var(--border);}
.sortbtn.active{color:var(--text-primary);border-color:var(--border-bright);background:#ffffff08;}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:14px;}
.card{background:var(--surface2);border:1px solid var(--border);border-radius:0 6px 6px 0;padding:12px 14px;
  cursor:pointer;transition:border-color .15s;}
.card:hover{border-color:var(--border-bright);}
.card.up{border-left:5px solid var(--green);}
.card.down{border-left:5px solid var(--red);}
.card.watch{border-left:5px solid var(--amber);}
.card-top{display:flex;justify-content:space-between;align-items:baseline;}
.tick{font-size:18px;font-weight:700;letter-spacing:-.02em;}
.dir{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
.up .dir{color:var(--green);} .down .dir{color:var(--red);} .watch .dir{color:var(--amber);}
.co{font-size:10px;color:var(--text-dim);margin-top:1px;}
.head{font-size:11px;color:var(--text-secondary);line-height:1.55;margin:8px 0;}
.pills{display:flex;gap:5px;flex-wrap:wrap;font-size:9px;font-weight:600;letter-spacing:.03em;}
.pill{border:1px solid var(--border);border-radius:3px;padding:2px 7px;color:var(--text-dim);text-transform:uppercase;white-space:nowrap;}
.pill.alert-up{background:var(--green-dim);border-color:var(--green-mid);color:var(--green);}
.pill.alert-down{background:var(--red-dim);border-color:var(--red-mid);color:var(--red);}
.next{margin-top:8px;font-size:10px;color:var(--text-dim);}
.next b{color:var(--text-secondary);font-weight:600;}
.open{margin-top:6px;font-size:10px;color:var(--blue);}
.empty{padding:30px;text-align:center;color:var(--text-dim);font-size:12px;}
</style>
</head>
<body>
<div class="topnav">
  <div class="brand">Drift<span>Tracker</span></div>
  <div class="meta" id="meta">loading…</div>
</div>
<div class="page">
  <div class="section">
    <div class="section-hdr">
      <span class="section-title">● Direction of travel — all tracked tickers</span>
      <span class="summary" id="summary"></span>
    </div>
    <div class="sortbar">
      <button class="sortbtn active" data-sort="direction">Direction</button>
      <button class="sortbtn" data-sort="build">Latest build</button>
      <button class="sortbtn" data-sort="ticker">A–Z</button>
    </div>
    <div class="wall" id="wall"><div class="empty">Loading drift-index.json…</div></div>
  </div>
</div>
<script>
var DATA=null,SORT='direction';
var DIRLBL={up:'Turning Up',down:'Turning Down',watch:'Stable — Watch'};
var DIRORD={down:0,watch:1,up:2};

function load(){
  fetch('drift-index.json',{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
    .then(function(j){DATA=j;render();})
    .catch(function(e){
      document.getElementById('wall').innerHTML=
        '<div class="empty">Could not load drift-index.json ('+e.message+').<br>'+
        'If opened as a local file, some browsers block fetch — host on GitHub Pages, or use a local server.</div>';
    });
}
function render(){
  var t=DATA.tickers.slice();
  if(SORT==='direction')t.sort(function(a,b){return DIRORD[a.direction]-DIRORD[b.direction]||a.ticker.localeCompare(b.ticker);});
  if(SORT==='build')t.sort(function(a,b){return b.build_date.localeCompare(a.build_date);});
  if(SORT==='ticker')t.sort(function(a,b){return a.ticker.localeCompare(b.ticker);});
  var n={up:0,down:0,watch:0};
  t.forEach(function(x){n[x.direction]++;});
  document.getElementById('summary').textContent=t.length+' tickers · '+n.down+' down · '+n.watch+' watch · '+n.up+' up';
  document.getElementById('meta').textContent='index updated '+DATA.updated;
  var w=document.getElementById('wall');w.innerHTML='';
  t.forEach(function(x){
    var c=document.createElement('div');
    c.className='card '+x.direction;
    c.onclick=function(){window.open(x.url,'drift_'+x.ticker,'width=1500,height=950,scrollbars=yes');};
    var alertPill=x.alert?'<span class="pill alert-'+x.direction+'">⛳ '+x.trigger+' fired</span>':'<span class="pill">'+x.trigger+'</span>';
    c.innerHTML=
      '<div class="card-top"><span class="tick">'+x.ticker+'</span><span class="dir">'+DIRLBL[x.direction]+'</span></div>'+
      '<div class="co">'+x.company+'</div>'+
      '<div class="head">'+x.headline+'</div>'+
      '<div class="pills">'+alertPill+
        '<span class="pill">'+x.rns_type+' · '+x.rns_date.slice(2).replace(/-/g,'/')+'</span>'+
        '<span class="pill">'+x.spec_version+'</span></div>'+
      (x.next_test&&x.next_test!=='—'?'<div class="next"><b>Next test:</b> '+x.next_test+'</div>':'')+
      '<div class="open">Open dashboard ↗</div>';
    w.appendChild(c);
  });
}
document.querySelectorAll('.sortbtn').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('.sortbtn').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active');SORT=b.dataset.sort;if(DATA)render();
  };
});
load();
</script>
</body>
</html>
